name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and build
    # Each OS has its own webview, and the Rust compiles per platform.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    permissions:
      contents: read

    steps:
      # The debug, coverage and release builds of the app do not fit in the
      # Linux runner's free disk together. Toolchains this job never uses
      # make the room.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # src/agentrq: the renderer, the extension host and the scratch backend.
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Use npm 12.2.0
        run: npm install -g npm@12.2.0

      # WebKitGTK and friends. libxdo is what Tauri's menu accelerators link.
      - name: Install the Linux webview packages
        if: runner.os == 'Linux'
        run: |
          # A trickling mirror once ate 27 minutes of a job. apt drops a connection
          # silent for 30 s and retries that file; the cap only ends a try that is
          # still stuck, and the next resumes from the packages already fetched.
          for try in 1 2 3; do
            timeout -k 30 300 sudo apt-get update -q -o Acquire::http::Timeout=30 -o Acquire::Retries=5 &&
              timeout -k 30 900 sudo apt-get install -y -q -o Dpkg::Use-Pty=0 -o DPkg::Lock::Timeout=60 -o Acquire::http::Timeout=30 -o Acquire::Retries=5 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev && break
            rc=$?
            [ "$try" = 3 ] && exit 1
            echo "::warning::apt try $try failed or stalled (exit $rc); retrying"
            # -k kills sudo, not its child: end what is left before recovering.
            sudo pkill -9 -x apt-get || true
            sudo pkill -9 -x dpkg || true
            timeout -k 10 120 sudo dpkg --configure -a || true
            sleep 10
          done

      - name: Install frontend dependencies
        working-directory: src/agentrq/frontend
        run: npm ci

      - name: Install dependencies
        working-directory: src/tauri
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src/tauri/core -> target
            src/tauri/src-tauri -> target

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # tauri-build checks resources exist: the extension host's bundle.
      - name: Bundle the extension host
        working-directory: src/tauri
        run: npm run build:ext-host

      # tauri::generate_context! reads frontendDist, so it must exist.
      - name: Build the renderer
        working-directory: src/tauri
        run: npm run build:renderer

      - name: Rust coverage gate
        working-directory: src/tauri
        shell: pwsh
        run: |
          $bin = Join-Path (rustc --print sysroot) "lib\rustlib\x86_64-pc-windows-msvc\bin"
          cargo llvm-cov show-env
          cargo llvm-cov --manifest-path src-tauri/Cargo.toml --no-report 2>&1 | Select-String "Running|test result|error" | Out-String -Width 600
          "== profraws"; Get-ChildItem src-tauri\target\llvm-cov-target -Filter *.profraw | ForEach-Object { "$($_.Name) $($_.Length)" }
          $exe = Get-ChildItem -Recurse src-tauri\target\llvm-cov-target\debug -Filter "agentrq_tauri_lib-*.exe" | Select-Object -First 1
          "== sections of $($exe.FullName)"; & "$bin\llvm-objdump.exe" -h $exe.FullName 2>&1 | Out-String -Width 300
          "== direct run"
          $env:LLVM_PROFILE_FILE = "$PWD\direct-%p.profraw"
          & $exe.FullName --test-threads=4 2>&1 | Select-Object -Last 3
          "exit=$LASTEXITCODE"
          Get-ChildItem -Filter "direct-*.profraw" | ForEach-Object { "$($_.Name) $($_.Length)" }
          "== single test"
          & $exe.FullName --exact cookie_jar::tests 2>&1 | Select-Object -Last 2
          & $exe.FullName --list 2>&1 | Select-Object -First 3
          $one = (& $exe.FullName --list 2>&1 | Select-Object -First 1) -replace ": test$",""
          Remove-Item direct-*.profraw -ErrorAction SilentlyContinue
          & $exe.FullName --exact $one 2>&1 | Select-Object -Last 2
          "exit=$LASTEXITCODE"
          Get-ChildItem -Filter "direct-*.profraw" | ForEach-Object { "$($_.Name) $($_.Length)" }
          "== core for comparison"
          cargo llvm-cov --manifest-path core/Cargo.toml --no-report 2>&1 | Select-String "test result" | Out-String
          $cexe = Get-ChildItem -Recurse core\target\llvm-cov-target\debug -Filter "agentrq_desktop_core-*.exe" | Select-Object -First 1
          & "$bin\llvm-objdump.exe" -h $cexe.FullName 2>&1 | Select-String "lcov|lprf" | Out-String
